<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes mvairWave { 0%,100% { transform: scaleY(0.34); } 50% { transform: scaleY(1); } }
@keyframes mvairFlow { 0% { transform: translateX(-6px); opacity:0.2; } 50% { opacity:1; } 100% { transform: translateX(6px); opacity:0.2; } }
@media (prefers-reduced-motion: reduce) { .mvair-bar { animation: none !important; transform: scaleY(0.7) !important; } .mvair-flowdot { animation: none !important; } }
</style>
</helmet>
<div style="display:flex; align-items:center; gap:28px; width:100%;">

  <div style="display:flex; align-items:center; gap:5px; height:132px; flex:1; min-width:0;">

    <div class="mvair-bar" style="width:5px; height:98px; border-radius:3px; background:#2DD4BF; transform-origin:center; animation:mvairWave 1.7s ease-in-out infinite; animation-delay:0.72s;"></div>

    <div class="mvair-bar" style="width:5px; height:76px; border-radius:3px; background:#2DD4BF; transform-origin:center; animation:mvairWave 1.7s ease-in-out infinite; animation-delay:0.96s;"></div>
    <div class="mvair-bar" style="width:5px; height:46px; border-radius:3px; background:#2DD4BF; transform-origin:center; animation:mvairWave 1.7s ease-in-out infinite; animation-delay:1.04s;"></div>

  <div style="display:flex; align-items:center; gap:8px; flex:none;">
    <div style="width:34px; height:1px; background:rgba(255,255,255,0.18);"></div>
    <div class="mvair-flowdot" style="width:9px; height:9px; border-radius:50%; background:#C6F24E; box-shadow:0 0 12px rgba(198,242,78,0.6); animation:mvairFlow 1.7s ease-in-out infinite;"></div>
    <div style="width:34px; height:1px; background:rgba(255,255,255,0.18);"></div>
  </div>

    </div>
    <div style="font-family:'Fraunces',serif; font-size:30px; font-weight:550; color:#FFFFFF; letter-spacing:-0.02em; line-height:1.1;">Tue · 9:30 am</div>
    <div style="font-family:'Hanken Grotesk',sans-serif; font-size:14px; color:#9FB2B8; margin-top:6px;">New patient visit · Dr. Reyes</div>
    <div style="height:1px; background:rgba(255,255,255,0.1); margin:18px 0 14px;"></div>
    <div style="display:flex; align-items:center; gap:9px;">
      <div style="width:20px; height:20px; border-radius:50%; background:#2DD4BF; display:flex; align-items:center; justify-content:center; flex:none;">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2 L5 8.5 L9.5 3.5" stroke="#06222A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-family:'Hanken Grotesk',sans-serif; font-size:14px; color:#C9D6DA;">Confirmed and added to the calendar</div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:160}}">
