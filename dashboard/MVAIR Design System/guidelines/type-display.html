<!-- @dsCard group="Type" viewport="700x230" name="Display — Newsreader" subtitle="Serif display + italic emphasis" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--mvair-font-display); color: var(--mvair-text-primary); }
  .meta { font-family: var(--mvair-font-sans); font-size: 11px; color: var(--mvair-text-muted); margin-top: 4px; }
  .h1 { font-size: 52px; line-height: 1.04; letter-spacing: -0.025em; font-weight: 600; margin: 0; }
  .h2 { font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600; margin: 18px 0 0; }
  em { font-style: italic; font-weight: 500; color: var(--mvair-accent); }
</style></head>
<body>
  <p class="h1">Booking that sounds <em>human</em>.</p>
  <div class="meta">Newsreader 600 · 52px · −0.025em — hero display</div>
  <p class="h2">Every call handled, start to finish.</p>
  <div class="meta">Newsreader 600 · 30px · −0.02em — section heading. Italic = aqua emphasis word.</div>
</body></html>
