<!-- @dsCard group="Colors" viewport="700x180" name="Primary &amp; Accent" subtitle="Petrol teal, aqua, and the single-use signal" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--mvair-font-sans); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: 10px; height: 88px; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; }
  .name { font-size: 12px; font-weight: 600; color: var(--mvair-text-primary); margin-top: 8px; }
  .hex { font-family: var(--mvair-font-mono); font-size: 11px; color: var(--mvair-text-muted); }
</style></head>
<body>
  <div class="grid">
    <div><div class="sw" style="background:var(--mvair-primary)"></div><div class="name">Primary</div><div class="hex">#0B5563</div></div>
    <div><div class="sw" style="background:var(--mvair-primary-dark)"></div><div class="name">Primary dark</div><div class="hex">#084149</div></div>
    <div><div class="sw" style="background:var(--mvair-accent)"></div><div class="name">Accent</div><div class="hex">#2DD4BF</div></div>
    <div><div class="sw" style="background:var(--mvair-accent-hover)"></div><div class="name">Accent hover</div><div class="hex">#5FE3D3</div></div>
    <div><div class="sw" style="background:var(--mvair-signal)"></div><div class="name">Signal</div><div class="hex">#C6F24E</div></div>
  </div>
</body></html>
