<!-- @dsCard group="Spacing" viewport="700x170" name="Corner Radii" subtitle="Tighter on controls, larger on marketing surfaces" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--mvair-font-sans); }
  .row { display:flex; gap:18px; align-items:flex-end; }
  .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width: 76px; height: 64px; background: var(--mvair-primary-light); border:1px solid var(--mvair-primary); border-bottom:none; }
  .tok { font-family: var(--mvair-font-mono); font-size: 11px; color: var(--mvair-text-muted); }
  .nm { font-size: 12px; font-weight:600; color: var(--mvair-text-primary); }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:6px 6px 0 0"></div><span class="nm">badge</span><span class="tok">6px</span></div>
    <div class="col"><div class="box" style="border-radius:8px 8px 0 0"></div><span class="nm">button</span><span class="tok">8px</span></div>
    <div class="col"><div class="box" style="border-radius:12px 12px 0 0"></div><span class="nm">card</span><span class="tok">12px</span></div>
    <div class="col"><div class="box" style="border-radius:18px 18px 0 0"></div><span class="nm">lg</span><span class="tok">18px</span></div>
    <div class="col"><div class="box" style="border-radius:22px 22px 0 0"></div><span class="nm">xl</span><span class="tok">22px</span></div>
    <div class="col"><div class="box" style="border-radius:24px 24px 0 0"></div><span class="nm">2xl</span><span class="tok">24px</span></div>
  </div>
</body></html>
