<!-- @dsCard group="Type" viewport="700x300" name="Role Scale" subtitle="Every type role, in use" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--mvair-hairline); }
  .tok { font-family: var(--mvair-font-mono); font-size: 11px; color: var(--mvair-text-muted); width: 190px; flex:none; }
  .ex { color: var(--mvair-text-primary); }
  .disp { font-family: var(--mvair-font-display); font-weight:600; }
  .sans { font-family: var(--mvair-font-sans); }
</style></head>
<body>
  <div class="row"><span class="tok">page-title · 28px</span><span class="ex disp" style="font-size:28px;font-weight:500;letter-spacing:-.01em">Overview</span></div>
  <div class="row"><span class="tok">kpi · 30px/700</span><span class="ex sans" style="font-size:30px;font-weight:700">128</span></div>
  <div class="row"><span class="tok">section-heading · 16px</span><span class="ex sans" style="font-size:16px;font-weight:600">Recent sessions</span></div>
  <div class="row"><span class="tok">body · 15px</span><span class="ex sans" style="font-size:15px">Default interface text</span></div>
  <div class="row"><span class="tok">body-sm · 13px</span><span class="ex sans" style="font-size:13px;color:var(--mvair-text-secondary)">Secondary / meta text</span></div>
  <div class="row"><span class="tok">card-title · 11px</span><span class="ex sans" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mvair-text-secondary)">Total Calls Today</span></div>
</body></html>
