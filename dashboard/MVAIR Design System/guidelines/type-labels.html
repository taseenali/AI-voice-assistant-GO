<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow, Labels &amp; Mono" subtitle="Uppercase eyebrows, table headers, monospace IDs" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--mvair-font-sans); display:flex; gap:48px; flex-wrap:wrap; }
  .eyebrow { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.16em; color:var(--mvair-primary); }
  .th { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--mvair-text-secondary); }
  .mono { font-family: var(--mvair-font-mono); font-size:12px; color:var(--mvair-text-muted); }
  .lbl { font-size:10px; color:var(--mvair-text-muted); margin-top:6px; }
  .col { display:flex; flex-direction:column; }
</style></head>
<body>
  <div class="col"><span class="eyebrow">How it works</span><span class="lbl">eyebrow · .16em</span></div>
  <div class="col"><span class="th">Session ID</span><span class="lbl">table header · .06em</span></div>
  <div class="col"><span class="mono">s-9F2A-44B1-0C7E</span><span class="lbl">mono · IDs &amp; values</span></div>
</body></html>
