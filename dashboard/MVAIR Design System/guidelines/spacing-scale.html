<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base — the rhythm of the system" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--mvair-font-sans); }
  .row { display:flex; align-items:flex-end; gap:18px; }
  .col { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .bar { background: var(--mvair-accent); border-radius: 3px; height: 16px; }
  .tok { font-family: var(--mvair-font-mono); font-size: 11px; color: var(--mvair-text-muted); }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="width:4px"></div><span class="tok">1 · 4</span></div>
    <div class="col"><div class="bar" style="width:8px"></div><span class="tok">2 · 8</span></div>
    <div class="col"><div class="bar" style="width:12px"></div><span class="tok">3 · 12</span></div>
    <div class="col"><div class="bar" style="width:16px"></div><span class="tok">4 · 16</span></div>
    <div class="col"><div class="bar" style="width:24px"></div><span class="tok">6 · 24</span></div>
    <div class="col"><div class="bar" style="width:32px"></div><span class="tok">8 · 32</span></div>
    <div class="col"><div class="bar" style="width:48px"></div><span class="tok">12 · 48</span></div>
    <div class="col"><div class="bar" style="width:64px"></div><span class="tok">16 · 64</span></div>
    <div class="col"><div class="bar" style="width:96px"></div><span class="tok">24 · 96</span></div>
  </div>
</body></html>
