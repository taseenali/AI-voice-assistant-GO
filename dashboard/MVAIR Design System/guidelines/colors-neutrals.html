<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces &amp; Text" subtitle="Cool near-white surfaces, dark canvas, text ramp" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--mvair-font-sans); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { border-radius: 10px; height: 88px; border: 1px solid var(--mvair-card-border); box-sizing: border-box; }
  .name { font-size: 12px; font-weight: 600; color: var(--mvair-text-primary); margin-top: 8px; }
  .hex { font-family: var(--mvair-font-mono); font-size: 11px; color: var(--mvair-text-muted); }
</style></head>
<body>
  <div class="grid">
    <div><div class="sw" style="background:var(--mvair-surface)"></div><div class="name">Surface</div><div class="hex">#FBFCFD</div></div>
    <div><div class="sw" style="background:var(--mvair-white)"></div><div class="name">Card</div><div class="hex">#FFFFFF</div></div>
    <div><div class="sw" style="background:var(--mvair-dark)"></div><div class="name">Dark canvas</div><div class="hex">#0C1A20</div></div>
    <div><div class="sw" style="background:var(--mvair-text-primary)"></div><div class="name">Text primary</div><div class="hex">#0E1B23</div></div>
    <div><div class="sw" style="background:var(--mvair-text-secondary)"></div><div class="name">Text secondary</div><div class="hex">#5A6B72</div></div>
    <div><div class="sw" style="background:var(--mvair-text-muted)"></div><div class="name">Text muted</div><div class="hex">#8A979D</div></div>
  </div>
</body></html>
