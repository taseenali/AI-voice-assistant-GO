<!-- @dsCard group="Type" viewport="700x230" name="Body — Hanken Grotesk" subtitle="UI/body grotesque sans, weights 400–700" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--mvair-font-sans); color: var(--mvair-text-primary); }
  .lede { font-size: 19px; line-height: 1.6; color: var(--mvair-text-secondary); margin: 0 0 14px; max-width: 560px; }
  .body { font-size: 15px; line-height: 1.6; margin: 0 0 14px; max-width: 560px; }
  .weights { display:flex; gap:20px; font-size: 20px; }
  .weights span { display:flex; flex-direction:column; }
  .weights small { font-family: var(--mvair-font-mono); font-size: 10px; color: var(--mvair-text-muted); }
</style></head>
<body>
  <p class="lede">MVAIR answers every call, books the appointment, and flags urgent cases — day or night.</p>
  <p class="body">Default UI body at 15px / 1.6. Used for table cells, descriptions, form labels, and most interface copy across the dashboard.</p>
  <div class="weights">
    <span style="font-weight:400">Regular<small>400</small></span>
    <span style="font-weight:500">Medium<small>500</small></span>
    <span style="font-weight:600">Semibold<small>600</small></span>
    <span style="font-weight:700">Bold<small>700</small></span>
  </div>
</body></html>
