<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/mvair-icons.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; padding: 24px; background: var(--mvair-surface); } .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; } .lbl { font-family: var(--mvair-font-sans); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mvair-text-muted); margin-bottom: 8px; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Badge, Card, StatusDot } = window.MVAIRDesignSystem_49370a;
const { Phone, ArrowRight } = window.MvairIcons;
function Demo() {
  return (
    <div>
      <div className="lbl">Buttons</div>
      <div className="row">
        <Button>Save changes</Button>
        <Button variant="aqua">Book a demo</Button>
        <Button variant="secondary">Cancel</Button>
        <Button variant="outline" icon={Phone}>Call line</Button>
        <Button variant="ghost" icon={ArrowRight} iconRight>More</Button>
        <Button disabled>Disabled</Button>
      </div>
      <div className="lbl">Badges — status &amp; intent</div>
      <div className="row">
        <Badge variant="default" label="Default" />
        <Badge variant="success" label="Captured" />
        <Badge variant="warning" label="Pending" />
        <Badge variant="danger" label="Emergency" />
        <Badge variant="neutral" label="Neutral" />
        <Badge intent="dental" label="dental" />
        <Badge intent="urgent" label="urgent" />
        <Badge intent="followup" label="followup" />
      </div>
      <div className="lbl">Status dots</div>
      <div className="row">
        <StatusDot status="online" label="Operational" />
        <StatusDot status="warning" label="Degraded" />
        <StatusDot status="offline" label="Down" />
        <StatusDot status="live" label="Live · always answering" />
      </div>
      <div className="lbl" style={{marginTop: 4}}>Card</div>
      <Card style={{ maxWidth: 280 }}>
        <div style={{ fontFamily: 'var(--mvair-font-sans)', fontWeight: 600, color: 'var(--mvair-text-primary)' }}>Surface card</div>
        <div style={{ fontFamily: 'var(--mvair-font-sans)', fontSize: 13, color: 'var(--mvair-text-secondary)', marginTop: 4 }}>White, soft cool shadow, 12px radius.</div>
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
