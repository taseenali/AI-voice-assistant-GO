<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MVAIR — AI voice receptionist for medical practices</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/mvair-icons.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; }
  /* Elevation */
  .m-card { box-shadow: 0 1px 2px rgba(14,27,35,.04), 0 12px 30px -16px rgba(14,27,35,.14); transition: transform .25s ease, box-shadow .25s ease; }
  .m-card:hover { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(14,27,35,.05), 0 22px 48px -18px rgba(14,27,35,.22); }
  .m-dark-tile { box-shadow: 0 1px 2px rgba(14,27,35,.06), 0 24px 60px -28px rgba(12,26,32,.55); }
  .m-panel { box-shadow: 0 1px 2px rgba(14,27,35,.04), 0 30px 70px -34px rgba(14,27,35,.22); }
  .m-step-badge { box-shadow: 0 8px 20px -6px rgba(11,85,99,.5); }
  .m-connector { background: repeating-linear-gradient(90deg, var(--mvair-timeline-dash) 0 7px, transparent 7px 15px); }
  .m-glow { background: radial-gradient(circle, rgba(45,212,191,.16), transparent 68%); }
  .m-nav { background: rgba(251,252,253,.86); backdrop-filter: blur(12px); }
  @keyframes mvairPulse { 0% { transform: scale(1); opacity:1;} 70% { transform: scale(2.6); opacity:0;} 100%{opacity:0;} }
  @keyframes mvairWave { 0%,100% { transform: scaleY(.34);} 50% { transform: scaleY(1);} }
  @keyframes mvairFlow { 0% { transform: translateX(-6px); opacity:.2;} 50% { opacity:1;} 100% { transform: translateX(6px); opacity:.2;} }
  .m-pulse-ring { animation: mvairPulse 2.2s ease-out infinite; }
  .m-wave-bar { transform-origin:center; animation: mvairWave 1.7s ease-in-out infinite; }
  .m-flow-dot { animation: mvairFlow 1.7s ease-in-out infinite; }
  a { text-decoration: none; }
  @media (prefers-reduced-motion: reduce) { .m-pulse-ring,.m-flow-dot{animation:none!important;} .m-wave-bar{animation:none!important;transform:scaleY(.7)!important;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Landing.jsx"></script>
</body>
</html>
