[build]
builder = "NIXPACKS"
buildCommand = "npm install --omit=dev"

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables required in Railway dashboard:
#   NODE_ENV=production
#   PORT=3001
#   SQLITE_PATH=/data/medvoice.db        ← requires a Railway Volume mounted at /data
#   PUBLIC_URL=https://<your-service>.up.railway.app
#   JWT_SECRET=<openssl rand -hex 32>
#   VAPI_API_KEY=<from Vapi dashboard>
#   VAPI_WEBHOOK_SECRET=<random string — must match Vapi server URL headers>
#   VAPI_SPIKE_MODE=false
#   VAPI_LLM_MODEL=gpt-4o-mini
#   ALLOWED_ORIGINS=https://<your-dashboard>.vercel.app
#   PLATFORM_ADMIN_EMAIL=<super admin email>
#   PLATFORM_ADMIN_PASSWORD=<strong password>
#   G_CLIENT_EMAIL=<service account email>
#   G_PRIVATE_KEY=<service account private key>
#   G_CALENDAR_ID=<calendar id>
